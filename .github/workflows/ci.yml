name: CI

# Goal: keep confirming that the build and tests pass not only on the development
# machine (macOS) but also on the same Linux as the device. The Raspberry Pi runs
# Linux, so passing here is a prerequisite for the real device.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig 0.17.0
        run: |
          # Note: ziglang.org's index.json does not always list 0.17.0, but the
          # binary tarball is available. Pin the version to keep builds reproducible.
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo '1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig.tar.xz' | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Install libsecp256k1
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecp256k1-dev pkg-config

      - name: Check dependencies
        run: |
          pkg-config --modversion libsecp256k1
          zig version

      - name: Tests (official test vectors + integration + Core interop)
        working-directory: firmware
        run: zig build test

      - name: Tests in ReleaseSafe too
        working-directory: firmware
        run: |
          zig test tests.zig -OReleaseSafe $(pkg-config --cflags --libs libsecp256k1) -lc

      - name: Compile check for Pico (RP2040 / RP2350)
        working-directory: firmware
        run: |
          # Check on every run that the core still ports to the Pico family,
          # which does not assume Linux.
          zig build pico --summary all

      - name: Build the CLI and check it runs
        working-directory: firmware
        run: |
          zig build
          ./zig-out/bin/zhww version
          # The address must match the official BIP84 test vector
          OUT=$(./zig-out/bin/zhww address --mnemonic "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about")
          test "$OUT" = "bc1qcr8te4kr609gcawutmrza0j4xv80jy8z306fyu"
          echo "CLI OK: $OUT"

      - name: Signature matches the Core-verified vector
        working-directory: firmware
        run: |
          PSBT=$(jq -r .unsigned_psbt_base64 tests/vectors/core_psbt.json)
          EXPECTED=$(jq -r .expected_final_tx tests/vectors/core_psbt.json)
          MINE=$(printf '%s' "$PSBT" | ./zig-out/bin/zhww sign \
            --mnemonic "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" \
            2>/dev/null | grep '^FINAL_TX=' | cut -d= -f2-)
          test "$MINE" = "$EXPECTED"
          echo "sign OK (matches Bitcoin Core output)"

      - name: Handoff over microSD (FAT32)
        working-directory: firmware
        run: |
          sudo apt-get install -y mtools dosfstools
          IMG="$RUNNER_TEMP/card.img"
          mkfs.fat -F 32 -C "$IMG" 40000 >/dev/null
          jq -r .unsigned_psbt_base64 tests/vectors/core_psbt.json > in.txt
          mcopy -i "$IMG" in.txt ::/IN.PSBT
          ./zig-out/bin/zhww card list --image "$IMG"
          ./zig-out/bin/zhww card sign --image "$IMG" \
            --mnemonic "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
          ./zig-out/bin/zhww card list --image "$IMG"
          # The signed PSBT must match the pinned expectation
          GOT=$(mtype -i "$IMG" ::/OUT.PSBT | sha256sum | cut -d' ' -f1)
          WANT=$(jq -r .signed_psbt_sha256 tests/vectors/core_psbt.json)
          test "$GOT" = "$WANT"
          fsck.fat -n "$IMG"
          echo "FAT32 OK (handoff and signature match expectations; fsck clean)"

      - name: EVM signing (matches the independent eth-account implementation)
        working-directory: firmware
        run: |
          MN="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
          TX=$(printf '%s' '{"chainId":1,"nonce":7,"gasLimit":21000,"maxFeePerGas":30000000000,"maxPriorityFeePerGas":1000000000,"to":"0x3535353535353535353535353535353535353535","value":123456789,"data":"0x"}' \
            | ./zig-out/bin/zhww evm-sign --mnemonic "$MN" 2>/dev/null)
          EXPECTED="02f86f0107843b9aca008506fc23ac0082520894353535353535353535353535353535353535353584075bcd1580c080a08b29bfd611a0f695677f38218b2a6d02218f906adedbb1f171aa49b261794de2a02e5c9604faa6d3f48c89f8568aa04ea6cef7e058d0464ef4447989524c1bd4cf"
          test "$TX" = "$EXPECTED"
          echo "EVM OK (EIP-1559 signature matches the independent implementation)"

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5

      - name: "EVM: a local node accepts our signed transactions (anvil)"
        working-directory: firmware
        run: |
          # The EVM counterpart of the Bitcoin Core interop test: a real node must accept and mine
          # the transactions this firmware signs. anvil derives its accounts from the standard test
          # mnemonic at m/44'/60'/0'/0/, which is exactly the path this firmware uses.
          anvil --port 8545 --chain-id 31337 &
          bash tests/evm_node_check.sh
          kill %1

      - name: EVM display (evm-show)
        working-directory: firmware
        run: |
          RAW=""
          OUT=$(printf '%s' "$RAW" | ./zig-out/bin/zhww evm-show 2>/dev/null)
          echo "$OUT"
          echo "$OUT" | grep -q 'transfer(address,uint256)'
          echo "$OUT" | grep -q '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          echo "evm-show OK (shows the selector and the EIP-55 address)"

      - name: Light channel unit tests (light-encode / light-decode)
        working-directory: firmware
        run: |
          # The CLI is not reachable from tests.zig (that root is src/root.zig), so the light
          # tool's own tests need the module spelled out. They cover the round trip, the
          # impairments the receiver measures as survivable, and an excessive noise level that
          # must lose the transfer instead of returning wrong data.
          zig test --dep zhww -Mroot=src/cli/light_tool.zig -Mzhww=src/root.zig \
            -lc $(pkg-config --cflags --libs libsecp256k1)

      - name: Light channel round trip (PSBT -> flickering screen -> PSBT)
        working-directory: firmware
        run: |
          # The whole light link on a PC, on a real PSBT: base64 -> UR parts -> frames -> raw
          # 8-bit ADC samples (3 kHz ADC, 30 symbols/s, the pairing in docs/09) and back through
          # the streaming receiver and ur_receive. The output must be the same base64.
          jq -r .unsigned_psbt_base64 tests/vectors/core_psbt.json > "$RUNNER_TEMP/light-psbt.txt"
          ./zig-out/bin/zhww light-encode < "$RUNNER_TEMP/light-psbt.txt" > "$RUNNER_TEMP/light-samples.bin"
          ./zig-out/bin/zhww light-decode < "$RUNNER_TEMP/light-samples.bin" > "$RUNNER_TEMP/light-out.txt"
          diff -u "$RUNNER_TEMP/light-psbt.txt" "$RUNNER_TEMP/light-out.txt"
          echo "light OK (PSBT -> samples -> PSBT round-trips)"

          # At the levels the receiver's tests measure as survivable, one impairment at a time.
          for OPT in "--noise 15" "--flicker 20"; do
            ./zig-out/bin/zhww light-encode $OPT < "$RUNNER_TEMP/light-psbt.txt" > "$RUNNER_TEMP/light-samples.bin"
            ./zig-out/bin/zhww light-decode $OPT < "$RUNNER_TEMP/light-samples.bin" > "$RUNNER_TEMP/light-out.txt"
            diff -u "$RUNNER_TEMP/light-psbt.txt" "$RUNNER_TEMP/light-out.txt"
          done
          echo "light OK (noise sigma 15 and flicker amplitude 20 still round-trip)"

          # A clearly excessive level must fail with nothing on stdout, not return wrong data.
          ./zig-out/bin/zhww light-encode --noise 60 < "$RUNNER_TEMP/light-psbt.txt" > "$RUNNER_TEMP/light-samples.bin"
          if ./zig-out/bin/zhww light-decode < "$RUNNER_TEMP/light-samples.bin" > "$RUNNER_TEMP/light-out.txt" 2>/dev/null; then
            echo "noise 60 decoded, which it must not"; exit 1
          fi
          test ! -s "$RUNNER_TEMP/light-out.txt"
          echo "light OK (noise 60 fails loudly, no wrong PSBT)"

      - name: Display check (show)
        working-directory: firmware
        run: |
          PSBT=$(jq -r .unsigned_psbt_base64 tests/vectors/core_psbt.json)
          OUT=$(printf '%s' "$PSBT" | ./zig-out/bin/zhww show --network regtest 2>/dev/null)
          echo "$OUT"
          echo "$OUT" | grep -q 'fee: 10000 sats'
          echo "show OK (fee shown as 10000 sats, same as Core)"

      - name: UR round trip (QR transfer)
        working-directory: firmware
        run: |
          PSBT=$(jq -r .unsigned_psbt_base64 tests/vectors/core_psbt.json)
          MINE=$(printf '%s' "$PSBT" | ./zig-out/bin/zhww ur --fragment 40 2>/dev/null \
            | ./zig-out/bin/zhww ur-decode 2>/dev/null)
          test "$MINE" = "$PSBT"
          echo "UR OK (PSBT -> UR -> PSBT round-trips)"
